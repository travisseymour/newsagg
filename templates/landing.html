<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>firfly.us</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #000000;
      color: #e8e6e0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    .container {
      max-width: 480px;
    }
    h1 {
      font-size: 2rem;
      font-weight: 300;
      margin-bottom: 1rem;
      color: #888;
    }
    p {
      color: #555;
      font-size: 1rem;
      line-height: 1.6;
    }
    .version {
      margin-top: 2rem;
      font-size: 0.75rem;
      color: #333;
    }
    .image-container {
      margin-top: 3rem;
      text-align: center;
    }
    .image-container img {
      max-width: 100%;
      max-height: 400px;
      border-radius: 8px;
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>firfly.us</h1>
    <p>There is nothing to see here.</p>
    <div class="version">v{{ app_version }}</div>
  </div>
  <div class="image-container">
    <img src="{{ url_for('static', filename='image/firefly-serenity.webp') }}" alt="Serenity">
  </div>
</body>
</html>
